name: CI — Typecheck, Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict check (tsc --noEmit)
        run: npm run check

      - name: Run automated test suite (Vitest)
        run: npx vitest run

      - name: Build production frontend & PWA bundle
        run: npm run build

      - name: Bundle Electron main, preload & server
        run: node scripts/build-electron.js
