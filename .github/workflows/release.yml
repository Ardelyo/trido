name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows .exe installer ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build frontend + Electron (Windows)
        run: npm run build:electron:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize hyphenated installer filename for Landing Page direct link
        shell: bash
        run: |
          if [ -f "dist-release/Trido Setup 1.0.0.exe" ]; then
            cp "dist-release/Trido Setup 1.0.0.exe" "dist-release/Trido-Setup-1.0.0.exe"
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-release/*.exe
            dist-release/*.exe.blockmap
            dist-release/latest.yml
          retention-days: 3

  # ── macOS .dmg ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend + Electron (macOS)
        run: npm run build:electron:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist-release/*.dmg
            dist-release/*.dmg.blockmap
            dist-release/latest-mac.yml
          retention-days: 3

  # ── Linux .AppImage ────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend + Electron (Linux)
        run: npm run build:electron:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist-release/*.AppImage
            dist-release/latest-linux.yml
          retention-days: 3

  # ── Portable ZIP (Node.js required, all platforms) ─────────────────────────
  build-zip:
    name: Build Portable ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite frontend
        run: npm run build

      - name: Package portable ZIP
        run: |
          mkdir -p release-zip
          cp -r dist public server utils docs release-zip/
          cp server.ts constants.ts types.ts package.json package-lock.json release-zip/
          cp tsconfig.json tsconfig.server.json .env.example start.bat JURY_INSTALL_GUIDE.md README.md release-zip/
          cat > release-zip/start.sh << 'EOF'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          echo ""
          echo " ======================================================="
          echo "  TRIDO — AI Smartboard Classroom (Localhost Launcher)"
          echo " ======================================================="
          echo ""
          command -v node &>/dev/null || { echo "[ERROR] Node.js not found. Install from https://nodejs.org"; exit 1; }
          if [ ! -d "node_modules/tsx" ]; then
            echo "[1/2] Installing dependencies..."
            npm install --no-audit --no-fund --loglevel=error
          fi
          echo "[2/2] Starting Trido server at http://localhost:3000 ..."
          (sleep 2 && (xdg-open "http://localhost:3000/?app=true" 2>/dev/null || open "http://localhost:3000/?app=true" 2>/dev/null || true)) &
          npx tsx server.ts
          EOF
          chmod +x release-zip/start.sh
          cd release-zip && zip -r ../trido-portable-${{ github.ref_name }}.zip . && cd ..

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: trido-portable-${{ github.ref_name }}.zip
          retention-days: 3

  # ── Publish Release ────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -lh release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Trido ${{ github.ref_name }}"
          body: |
            ## 🎓 Trido — AI Smartboard for Inclusive Classroom Education

            ### ⬇️ Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows Installer | `Trido-Setup-1.0.0.exe` | 1-click Windows desktop installer (no Node.js or terminal required) |
            | 🍎 macOS | `Trido-*.dmg` | Open DMG and drag to Applications |
            | 🐧 Linux | `Trido-*.AppImage` | `chmod +x` then run |
            | 📦 Portable ZIP | `trido-portable-*.zip` | Cross-platform source + prebuilt `dist/` (`start.bat` / `start.sh`) |

            ### 🧠 AI Model & API Key Options
            - **Option 1 — 100% Free & Offline (Ollama Local Models):** Open **Settings → AI Configuration** and click **1-Click Download** for `trido-model:latest` or `trido-gemma:2b`.
            - **Option 2 — Personal Cloud API Key:** Enter your free [Google AI Studio API Key](https://aistudio.google.com/apikey) (`GEMINI_API_KEY`) in Settings.
          files: release-files/*
          draft: false
          prerelease: false
