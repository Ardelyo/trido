<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trido Smartboard — Setup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f7f5;
    color: #0a1a3a;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 2rem;
    user-select: none;
    -webkit-app-region: drag;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 1.5rem;
    padding: 2.5rem;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(10, 26, 58, 0.08);
    -webkit-app-region: no-drag;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 0.25rem;
  }
  .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #1550aa;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 12px rgba(21, 80, 170, 0.2);
  }
  .logo {
    font-size: 1.75rem;
    font-weight: 900;
    color: #1550aa;
    letter-spacing: -0.06em;
  }
  h2 { font-size: 0.95rem; color: #64748b; font-weight: 600; margin-bottom: 1.75rem; }
  label { display: block; font-size: 0.85rem; color: #334155; margin-bottom: 0.5rem; font-weight: 700; }
  input {
    width: 100%;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    font-family: monospace;
  }
  input:focus { border-color: #1550aa; background: #ffffff; }
  .hint {
    font-size: 0.78rem;
    color: #64748b;
    margin-top: 0.5rem;
    line-height: 1.5;
  }
  .hint a {
    color: #1550aa;
    font-weight: 700;
    text-decoration: underline;
    cursor: pointer;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    background: #1550aa;
    color: white;
    border: none;
    padding: 0.85rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #0d3a80; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #dc2626; font-size: 0.82rem; margin-top: 0.75rem; display: none; font-weight: 600; }
  .loading { display: none; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; color: #64748b; font-size: 0.85rem; font-weight: 600; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #cbd5e1;
    border-top-color: #1550aa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="header-brand">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" style="width: 22px; height: 22px;" fill="none">
          <path
            d="M7 4.5v15l4.2-4.1 2.9 5.1 2.4-1.3-2.9-5H19L7 4.5Z"
            fill="#ffffff"
            stroke="#ffffff"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="logo">Trido</div>
    </div>
    <h2>Konfigurasi Awal Aplikasi Desktop</h2>

    <label for="apikey">Google AI Studio API Key (Opsional)</label>
    <input id="apikey" type="password" placeholder="AIzaSy…" autocomplete="off" spellcheck="false" />
    <div class="hint">
      Kunci API Gemini dapat diperoleh gratis di <a onclick="window.electronAPI.openExternal('https://aistudio.google.com/apikey')">aistudio.google.com/apikey</a>.
      Tersimpan aman secara lokal di laptop Anda.
    </div>

    <div class="error" id="error"></div>

    <button id="btn" onclick="save()">Buka Smartboard ↵</button>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Memulai server lokal…
    </div>
  </div>

  <script>
    async function save() {
      const key = document.getElementById('apikey').value.trim();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      const loading = document.getElementById('loading');

      if (!key || key.length < 10) {
        err.style.display = 'block';
        err.textContent = 'Mohon masukkan kunci API yang valid.';
        return;
      }

      err.style.display = 'none';
      btn.disabled = true;
      loading.style.display = 'flex';

      const result = await window.electronAPI.saveApiKey(key);
      if (!result.ok) {
        loading.style.display = 'none';
        btn.disabled = false;
        err.style.display = 'block';
        err.textContent = result.error || 'Gagal memulai server. Periksa kembali kunci API Anda.';
      }
    }

    document.getElementById('apikey').addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
    });
  </script>
</body>
</html>
