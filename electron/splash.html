<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trido Smartboard — Starting…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f7f5;
    color: #0a1a3a;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
    -webkit-app-region: drag;
  }
  .logo-box {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #1550aa;
    display: grid;
    place-items: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(21, 80, 170, 0.2);
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 900;
    color: #1550aa;
    letter-spacing: -0.06em;
    margin-bottom: 0.25rem;
  }
  .tagline {
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 2.5rem;
    letter-spacing: -0.01em;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: #1550aa;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 1rem;
  }
  .status {
    color: #64748b;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="logo-box">
    <svg viewBox="0 0 24 24" style="width: 34px; height: 34px;" fill="none">
      <path
        d="M7 4.5v15l4.2-4.1 2.9 5.1 2.4-1.3-2.9-5H19L7 4.5Z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="1.2"
        stroke-linejoin="round"
      />
    </svg>
  </div>
  <div class="logo">Trido</div>
  <div class="tagline">AI Smartboard for Inclusive Education</div>
  <div class="spinner"></div>
  <div class="status">Memulai Digital Classroom…</div>
</body>
</html>
